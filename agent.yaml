# Human-readable app slug used by Agent Engine tooling.
name: nimble-web-agent

# Python import path to the SDK App instance.
entrypoint: hello_world_agent.main:app
framework: langgraph

features:
  durable_workflow: true
  memory: false

# Model calls and the Nimble tools run in the tool sandbox.
sandboxes:
  agent:
    secrets: [NIMBLE_API_KEY, LLM_API_KEY]
    tools: []
    network:
      egress_mode: allow_list
      egress: &egress
        - fqdn: api.openai.com  # change if you change the LLM in llm.py
          ports: [443]
        - fqdn: sdk.nimbleway.com
          ports: [443]
        # - fqdn: mcp.nimbleway.com  # only with the MCP alternative below
        #   ports: [443]
  tool:
    secrets: [NIMBLE_API_KEY, LLM_API_KEY]
    tools: [nimble_search, nimble_extract, nimble_research]
    network:
      egress_mode: allow_list
      egress: *egress

# Alternative: use Nimble's hosted MCP server for search and extract instead of
# the SDK tools. Uncomment this block and the mcp.nimbleway.com egress entry,
# then remove nimble_search and nimble_extract from tools.py and from
# sandboxes.tool.tools so the agent does not see duplicate tools.
